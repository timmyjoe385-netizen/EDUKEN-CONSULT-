name: EDUKEN build check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feat/customer-wallet-system-20261016, fix/theme-parity-and-modal-colours-20261020]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build website
        run: npm run build
      - name: Run validation and security regression tests
        run: npm run test:validation
