name: EDUKEN build and Cloudflare deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feat/customer-wallet-system-20261016, fix/theme-parity-and-modal-colours-20261020]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build website
        run: npm run build

  deploy-preview:
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build preview website against the isolated test project
        run: npm run build
        env:
          # Publishable frontend key and URL are intentionally public. Keep these
          # scoped to the preview build so preview never silently falls back to production.
          VITE_SUPABASE_URL: https://wpktzogarfqrgkirzdpy.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_1M8EMlYF_U0hpVvtWurNSg_pO_ZwUSB
          VITE_ENABLE_TEST_WRITES: 'true'
      - name: Deploy isolated preview Worker
        run: npx wrangler deploy --env preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 6c2433e899d3005cdf82b8eaa98de61f
      - name: Smoke-test isolated guest payment recovery endpoint
        if: github.event_name == 'pull_request' && (github.head_ref == 'fix/guest-payment-return-recovery-20261019' || github.head_ref == 'integration/main-release-candidate-20261020')
        env:
          TEST_SUPABASE_URL: https://wpktzogarfqrgkirzdpy.supabase.co
          TEST_SUPABASE_PUBLISHABLE_KEY: sb_publishable_1M8EMlYF_U0hpVvtWurNSg_pO_ZwUSB
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.TEST_SUPABASE_URL;
          const key = process.env.TEST_SUPABASE_PUBLISHABLE_KEY;
          if (!base || !key) throw new Error('Isolated test Supabase URL/publishable key is not configured.');
          const response = await fetch(`${base}/functions/v1/eduken-api/api/payments/recover-guest`, {
            method: 'POST',
            headers: { 'content-type': 'application/json', apikey: key },
            body: JSON.stringify({ reference: 'EDK-PAY-AAAAAAAAAAAAAAAAAA' }),
          });
          const body = await response.json().catch(() => ({}));
          if (response.status !== 404 || !String(body.error || '').includes('could not match this reference')) {
            throw new Error(`Expected safe 404 for nonexistent test reference; got HTTP ${response.status}: ${JSON.stringify(body)}`);
          }
          console.log('Recovery endpoint reached isolated database and safely rejected a nonexistent reference (HTTP 404). No payment was initiated.');
          NODE

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build website
        run: npm run build
      - name: Deploy Worker and assets to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 6c2433e899d3005cdf82b8eaa98de61f
