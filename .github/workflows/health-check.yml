name: EDUKEN live health checks

on:
  pull_request:
    paths:
      - ".github/workflows/health-check.yml"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      test_email:
        description: "Send a test email to verify alert delivery"
        required: false
        type: boolean
        default: false
      test_ai:
        description: "Run one real Ask EDUKEN smoke test (uses AI resources)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check live homepage
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --location --output /tmp/home.html --write-out '%{http_code}' --max-time 25 --retry 2 --retry-delay 2 'https://eduken-consult.timmyjoe385.workers.dev/')"
          echo "Homepage HTTP status: $code"
          test "$code" = "200"
          grep -qi 'EDUKEN' /tmp/home.html

      - name: Check public EDUKEN content API
        shell: bash
        env:
          SUPABASE_PUBLISHABLE_KEY: "sb_publishable__qH331oDMJzmjqlOig3C0Q_EIHRa24p"
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --location --output /tmp/public-content.json --write-out '%{http_code}' --max-time 25 --retry 2 --retry-delay 2 'https://pphxltbkwygqjtjgkhxu.supabase.co/functions/v1/eduken-api/public-content' -H "apikey: $SUPABASE_PUBLISHABLE_KEY")"
          echo "Public content API HTTP status: $code"
          test "$code" = "200"
          jq -e 'type == "object" or type == "array"' /tmp/public-content.json >/dev/null
          echo "Public content API returned valid JSON."

      - name: Check AI endpoint routing without using AI resources
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output /tmp/ai-route.json --write-out '%{http_code}' --max-time 20 'https://eduken-consult.timmyjoe385.workers.dev/api/ai-assistant')"
          echo "AI endpoint GET status (405 expected): $code"
          test "$code" = "405"

      - name: Check analytics API routing and access protection
        shell: bash
        run: |
          set -euo pipefail
          events_code="$(curl --silent --show-error --output /tmp/events.json --write-out '%{http_code}' --max-time 20 'https://eduken-consult.timmyjoe385.workers.dev/api/analytics/events')"
          summary_code="$(curl --silent --show-error --output /tmp/summary.json --write-out '%{http_code}' --max-time 20 'https://eduken-consult.timmyjoe385.workers.dev/api/analytics/summary')"
          echo "Analytics events endpoint GET status (405 expected): $events_code"
          echo "Analytics summary endpoint unauthenticated status (403 expected): $summary_code"
          test "$events_code" = "405"
          test "$summary_code" = "403"

      - name: Optional Ask EDUKEN live smoke test
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.test_ai == 'true'
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --location --output /tmp/ai-response.json --write-out '%{http_code}' --max-time 90 --retry 1 --retry-delay 3 'https://eduken-consult.timmyjoe385.workers.dev/api/ai-assistant' -H 'content-type: application/json' --data '{"question":"Explain what a scholarship is in one short sentence."}')"
          echo "Ask EDUKEN live smoke test HTTP status: $code"
          test "$code" = "200"
          jq -e '.answer | type == "string" and length > 0' /tmp/ai-response.json >/dev/null
          echo "Ask EDUKEN returned a non-empty answer."

      - name: Check email alert configuration
        id: email_config
        if: github.event_name != 'pull_request' && (failure() || github.event.inputs.test_email == 'true')
        shell: bash
        env:
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          if [ -n "$ALERT_EMAIL_TO" ] && [ -n "$ALERT_EMAIL_FROM" ] && [ -n "$SMTP_SERVER" ] && [ -n "$SMTP_PORT" ] && [ -n "$SMTP_USERNAME" ] && [ -n "$SMTP_PASSWORD" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Email alerts are not configured yet. Add the required repository Actions secrets to enable them."
          fi

      - name: Send email alert
        if: github.event_name != 'pull_request' && (failure() || github.event.inputs.test_email == 'true') && steps.email_config.outputs.enabled == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "${{ github.event.inputs.test_email == 'true' && 'TEST: EDUKEN CONSULT email alert delivery' || 'ALERT: EDUKEN CONSULT live health check failed' }}"
          to: ${{ secrets.ALERT_EMAIL_TO }}
          from: ${{ secrets.ALERT_EMAIL_FROM }}
          body: |
            ${{ github.event.inputs.test_email == 'true' && 'This is a test email to verify that EDUKEN CONSULT health alert delivery is configured correctly.' || 'An automated live health check for EDUKEN CONSULT has failed.' }}

            The check covers the live homepage, public content API, AI endpoint routing, and analytics API routing/access-protection. A manual Ask EDUKEN smoke test is available and uses AI resources.
            Please open this run to see the failed step and logs:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
