name: EDUKEN Playwright browser checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eduken-playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-browser-checks:
    name: Public website browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install project dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium for Playwright
        run: npx playwright install chromium --with-deps
      - name: Run branch preview browser checks
        run: npm run test:e2e
      - name: Upload browser report and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eduken-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
