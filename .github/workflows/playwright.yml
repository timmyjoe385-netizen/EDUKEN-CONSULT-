name: EDUKEN Playwright browser checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eduken-playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-browser-checks:
    name: Public website browser checks
    runs-on: ubuntu-latest
    # Dependency installation and Chromium setup can exceed 10 minutes on a cold runner.
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install project dependencies
        run: npm install --no-audit --no-fund --prefer-offline
      - name: Set up Deno for Edge Function checks
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Supabase Edge Function
        run: deno check --node-modules-dir=auto supabase/functions/eduken-api/index.ts
      - name: Install Chromium for Playwright
        run: npx playwright install chromium --with-deps
      - name: Test email alert validation
        run: npm run test:email-alerts
      - name: Run branch preview browser checks
        run: npm run test:e2e
      - name: Upload browser report and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eduken-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
